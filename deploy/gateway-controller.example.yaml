# Example only: provision namespaces and configuration Secrets first.
# gateway-config: config.yaml from config/rehydrator.gateway.example.yaml
# controller-config: config.yaml from config/rehydrator.controller.example.yaml
# Use the same tenant/database and path configuration in both Secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenet-nofear101-gateway
  namespace: rehydrator-gateways
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenet-nofear101-gateway
  template:
    metadata:
      labels:
        app: tenet-nofear101-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/raefon/rehydrator:0.7.1
          args: ["--role=gateway", "--config=/etc/rehydrator/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - name: config
              mountPath: /etc/rehydrator
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: tenet-nofear101-gateway
  namespace: rehydrator-gateways
spec:
  selector:
    app: tenet-nofear101-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenet-rehydrator-controller
  namespace: tenet-nofear101
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenet-rehydrator-controller
  template:
    metadata:
      labels:
        app: tenet-rehydrator-controller
    spec:
      # Must match the ownership/security context of your shared media volume.
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      containers:
        - name: controller
          image: ghcr.io/raefon/rehydrator:0.7.1
          args: ["--role=controller", "--config=/etc/rehydrator/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - name: config
              mountPath: /etc/rehydrator
              readOnly: true
            - name: media
              mountPath: /storage/media
              subPath: media-mirror
            - name: rclone
              mountPath: /storage/torbox
      volumes:
        - name: config
          secret:
            secretName: controller-config
        - name: media
          persistentVolumeClaim:
            claimName: config-nofear101
        - name: rclone
          persistentVolumeClaim:
            claimName: media-nofear101
---
apiVersion: v1
kind: Service
metadata:
  name: tenet-rehydrator-controller
  namespace: tenet-nofear101
spec:
  selector:
    app: tenet-rehydrator-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
