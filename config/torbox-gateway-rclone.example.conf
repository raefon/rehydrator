# Example gateway Service runs separately in rehydrator-gateways. Match the
# remote section name to your CSI rclone.remote (e.g. use [torbox] if remote: torbox).
# Mount this remote root at /storage/torbox in every media consumer.
[rehydrator]
type = webdav
url = http://tenet-nofear101-gateway.rehydrator-gateways.svc.cluster.local:8080/webdav/
vendor = other
user = rclone
# Generate with rclone obscure; keep the result in a Secret.
pass = REPLACE_WITH_OBSCURED_GATEWAY_DAV_PASSWORD
