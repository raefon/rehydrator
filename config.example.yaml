# Rehydrator example config
# Copy to /config/rehydrator.yaml and fill secrets from Kubernetes Secrets or your deployment tooling.

postgres_url: "postgres://<USER>:<PASSWORD>@<POSTGRES_HOST>:5432/<DATABASE>?sslmode=disable"
tenant: tenet-nofear101

health_addr: ":8080"
db_auto_migrate: true

csi_path: /storage/media

# Main reconcile loop
reconcile_interval_seconds: 30
cache_grace_hours: 24 # Local pruning policy, not TorBox retention.
max_retries: 10
concurrent_workers: 2

# Decypharr owns rearm and provider deletion. Configure TorBox inside Decypharr.
rearm_backend: decypharr

# Re-arm / prune safety limits
prune_enabled: true
rearm_enabled: true
max_prunes_per_run: 5
max_rearms_per_run: 3

# Provider deletion runs asynchronously through Decypharr. CSI/rclone may show stale paths.
prune_wait_for_csi_gone: false

# Archived content must be restored even if CSI still shows a stale path.
# Keep false to avoid treating stale mount entries as restored media.
rearm_short_circuit_if_csi_visible: false

# Compatibility alias. Keep aligned with csi.visibility_timeout_seconds.
csi_wait_seconds: 900

radarr:
  url: http://tenet-radarr.tenet-nofear101.svc.cluster.local:7878
  api_key: "<RADARR_API_KEY>"

radarr_sync:
  enabled: true
  interval_seconds: 60

sonarr:
  url: http://tenet-sonarr.tenet-nofear101.svc.cluster.local:8989
  api_key: "<SONARR_API_KEY>"

sonarr_sync:
  enabled: false
  interval_seconds: 60

decypharr:
  url: http://tenet-decypharr.tenet-nofear101.svc.cluster.local:8282
  username: ""
  password: ""
  api_token: "" # Decypharr Settings > Auth; required for authenticated provider pruning
  radarr_category: radarr
  sonarr_category: sonarr
  delete_files_on_prune: false # Legacy setting; prune always preserves local links.

seerr:
  url: http://tenet-seerr.tenet-nofear101.svc.cluster.local:5055
  api_key: "<SEERR_API_KEY>"
  sync:
    enabled: true
    interval_seconds: 300
    limit: 100

api:
  enabled: true
  token: "<REHYDRATOR_API_TOKEN>"
  require_token: true

metrics:
  enabled: true

playback:
  enabled: true
  rearm_on_play: true
  cooldown_seconds: 60
  ignored_titles: []
  ignored_title_contains: []

csi:
  visibility_timeout_seconds: 900
  visibility_poll_seconds: 10
  visibility_retry_seconds: 60

provider_cooldown_seconds: 900

rclone_rc:
  enabled: false
  url: http://localhost:5572
  username: ""
  password: ""
  refresh_after_rearm: false
  timeout_seconds: 10

jellyfin:
  refresh_mode: notification # Use targeted_scan with the Targeted Scans plugin installed.
  enabled: false
  url: http://jellyfin:8096
  api_key: ""
  refresh_after_rearm: true
  refresh_after_visibility: true
  refresh_after_import: true
  refresh_after_prune: false
  refresh_delay_seconds: 45
  timeout_seconds: 20
  max_refreshes_per_run: 5
  refresh_dedupe_minutes: 10

self_heal:
  enabled: true
  interval_seconds: 300
  refresh_available: true
  recent_hours: 24
  max_refreshes_per_run: 5

# Torrent-only cache loss recovery; NZB/Usenet files are excluded.
# Intentionally ARCHIVED items stay archived.
file_health:
  enabled: true
  interval_seconds: 300
  batch_size: 20
  failure_threshold: 3
  max_rearms_per_run: 2
  probe_timeout_seconds: 5
  outage_failure_percent: 50
  canary_path: "" # Optional known-readable file on the same remote mount.

torbox_health:
  enabled: false # Opt-in read-only account checks; requires the same TorBox account as Decypharr.
  api_key: "" # Prefer TORBOX_HEALTH_API_KEY from a Secret.
  interval_seconds: 900
  timeout_seconds: 20
