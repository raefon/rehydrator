name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rehydrator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test -mod=mod ./...

      - name: Compile application
        run: go build -mod=mod ./cmd/rehydrator

      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${TAG_NAME#v}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -mod=mod -ldflags="-X main.version=${VERSION}" \
            -o dist/rehydrator-linux-amd64 ./cmd/rehydrator

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -mod=mod -ldflags="-X main.version=${VERSION}" \
            -o dist/rehydrator-linux-arm64 ./cmd/rehydrator

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -mod=mod -ldflags="-X main.version=${VERSION}" \
            -o dist/rehydrator-darwin-arm64 ./cmd/rehydrator

          cd dist
          sha256sum rehydrator-* > checksums.txt

      - name: Upload release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GHCR image and GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=raw,value=latest

      - name: Set release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; replacing release assets."
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            echo "Creating release $TAG_NAME."
            gh release create "$TAG_NAME" \
              dist/* \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes
          fi
