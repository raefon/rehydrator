apiVersion: v1
kind: Secret
metadata:
  name: rehydrator-secrets
type: Opaque
stringData:
  postgres-url: postgres://user:pass@postgres:5432/tenantdb?sslmode=disable
  radarr-api-key: replace_me
  sonarr-api-key: replace_me
  seerr-api-key: replace_me
  decypharr-username: ""
  decypharr-password: ""
  decypharr-api-token: replace_me
  api-token: replace_me
  jellyfin-api-key: replace_me
  torbox-health-api-key: "" # Optional; read-only client usage, same account as Decypharr.
