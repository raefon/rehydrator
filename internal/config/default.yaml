# Rehydrator example config
# Copy to /config/rehydrator.yaml and fill secrets from Kubernetes Secrets or your deployment tooling.

postgres_url: "" # POSTGRES_URL
tenant: tenet-nofear101

# Combined runs both roles for local setups. CSI uses separate gateway/controller pods.
# See rehydrator.gateway.example.yaml and rehydrator.controller.example.yaml.
role: combined

health_addr: ":8080"
db_auto_migrate: true

csi_path: /storage/media

# Main reconcile loop
reconcile_interval_seconds: 30
cache_grace_hours: 24 # Informational local availability window; does not delete provider files.
max_retries: 10
concurrent_workers: 2

# Library rearm limits
rearm_enabled: true
max_rearms_per_run: 3

# Archived content must be restored even if CSI still shows a stale path.
# Keep false to avoid treating stale mount entries as restored media.

# Compatibility alias. Keep aligned with csi.visibility_timeout_seconds.

radarr:
  url: http://tenet-radarr.tenet-nofear101.svc.cluster.local:7878
  api_key: "<RADARR_API_KEY>"

radarr_sync:
  enabled: true
  interval_seconds: 60

sonarr:
  url: http://tenet-sonarr.tenet-nofear101.svc.cluster.local:8989
  api_key: "<SONARR_API_KEY>"

sonarr_sync:
  enabled: false
  interval_seconds: 60

seerr:
  url: http://tenet-seerr.tenet-nofear101.svc.cluster.local:5055
  api_key: "<SEERR_API_KEY>"
  sync:
    enabled: true
    interval_seconds: 300
    limit: 100

api:
  enabled: true
  token: "<REHYDRATOR_API_TOKEN>"
  require_token: true

metrics:
  enabled: true

playback:
  enabled: true
  rearm_on_play: true
  cooldown_seconds: 60
  ignored_titles: []
  ignored_title_contains: []

csi:
  visibility_timeout_seconds: 900
  visibility_poll_seconds: 10
  visibility_retry_seconds: 60

rclone_rc:
  enabled: false
  url: http://localhost:5572
  username: ""
  password: ""
  refresh_after_rearm: false
  timeout_seconds: 10

jellyfin:
  inventory_sync:
    mark_missing_in_arr: false # Opt-in file-record removal; requires same-mount file_health.canary_path.
    enabled: true # Requires targeted_scan mode and the Targeted Scans plugin.
    interval_seconds: 1800
    max_refreshes_per_run: 5
    cooldown_minutes: 360
    path_mappings: {} # Example: {"/storage/media": "/media"}; Jellyfin-visible prefixes.
  refresh_mode: notification # Use targeted_scan with the Targeted Scans plugin installed.
  enabled: false
  url: http://jellyfin:8096
  api_key: ""
  refresh_after_rearm: true
  refresh_after_visibility: true
  refresh_after_import: true
  refresh_delay_seconds: 45
  timeout_seconds: 20
  max_refreshes_per_run: 5
  refresh_dedupe_minutes: 10

self_heal:
  enabled: true
  interval_seconds: 300
  refresh_available: true
  recent_hours: 24
  max_refreshes_per_run: 5

# Torrent-only cache loss recovery; NZB/Usenet files are excluded.
# Intentionally ARCHIVED items stay archived.
file_health:
  canary_path: "" # Same-mount readable file, only for opt-in Arr missing-file updates.

# Direct TorBox gateway. For CSI use the separate gateway/controller examples.
gateway:
  enabled: true
  radarr_category: radarr
  sonarr_category: sonarr
  api_key: ""
  qb_username: arr
  qb_password: ""
  sab_api_key: ""
  dav_username: rclone
  dav_password: ""
  mount_path: /storage/torbox
  download_path: /storage/media/downloads/rehydrator
  submit_interval_seconds: 120
  active_poll_interval_seconds: 30 # Active TorBox status checks; 15–3600 seconds.
  recover_missing: true
