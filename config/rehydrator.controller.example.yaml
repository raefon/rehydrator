# Tenant deployment: mount CSI at /storage/torbox and shared media at /storage/media.
role: controller
tenant: tenet-nofear101
postgres_url: "" # POSTGRES_URL; same database/tenant as its gateway
health_addr: ":8080"
db_auto_migrate: false # Gateway/migration job must apply schema through 036 first.
csi_path: /storage/media
rearm_enabled: true
api:
  enabled: true
  require_token: true
  token: "" # API_TOKEN for Arr/Seerr/Jellyfin webhooks and controller APIs
gateway:
  # additional_categories: [sonarr-4k, radarr-4k]
  radarr_category: radarr
  sonarr_category: sonarr
  enabled: true
  # No TorBox, qBittorrent, SAB or DAV credentials needed by this role.
  mount_path: /storage/torbox
  download_path: /storage/media/downloads/rehydrator
radarr:
  url: http://tenet-radarr:7878
  api_key: "" # RADARR_API_KEY
sonarr:
  url: http://tenet-sonarr:8989
  api_key: "" # SONARR_API_KEY
jellyfin:
  enabled: false # Enable and configure using the main example for refreshes.

# Separate 4K deployments use library_edition: 4k and different Arr endpoints.
# These optional roots scope playback notifications; omit for legacy installs.
library_paths:
  - /storage/media/movies
  - /storage/media/series
# Enable only when a separate 4K controller is deployed with the same API token.
# seerr_4k_controller_url: http://tenet-rehydrator-4k:8080
