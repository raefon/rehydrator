name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rehydrator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test -mod=mod ./...

      - name: Compile application
        run: go build -mod=mod ./cmd/rehydrator

      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${TAG_NAME#v}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -mod=mod -ldflags="-X main.version=${VERSION}" \
            -o dist/rehydrator-linux-amd64 ./cmd/rehydrator

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -mod=mod -ldflags="-X main.version=${VERSION}" \
            -o dist/rehydrator-linux-arm64 ./cmd/rehydrator

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -mod=mod -ldflags="-X main.version=${VERSION}" \
            -o dist/rehydrator-darwin-arm64 ./cmd/rehydrator

          cd dist
          sha256sum rehydrator-* > checksums.txt

      - name: Upload release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 7